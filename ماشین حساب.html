<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        @font-face {
    font-family: "vazir";
    src: url(Vazir.ttf);
}

* {
    margin: 0;
    padding: 0;
    font-family: "vazir";
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: rgba(10,10,10,0.1);
}

.main {
    position: relative;
    display: flex;
    align-items: center;
    flex-direction: column;
    width: 300px;
    padding: 15px 10px;
    box-shadow: 5px 5px 5px rgba(0,0,0,0.18);
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
}

.display {
    position: relative;
    width: 80%;
    height: 80px;
    margin-bottom: 10px;
}

.display #result {
    font-size: 2em;
}

.buttons {
    margin-top: 20px;
    width: 100%;
}

.buttons button {
    height: 50px;
    width: 50px;
    padding: 10px;
    border-radius: 10px;
    background: none;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1.3em;
    box-shadow:
        inset 5px 5px 5px rgba(0,0,0,0.2),
        inset -5px 5px 15px rgba(255,255,255,0.1),
        5px 5px 15px rgba(0,0,0,0.3),
        -5px -5px 15px rgba(255,255,255,0.1);
}

.buttons button:hover {
    background: rgba(0,0,0,0.2);
}

#equalTo {
    width: 125px;
    background: #58d68d;
}

#clear {
    background: #ff8a65;
}

.dark_mod_btn {
    position: absolute;
    top: 0;
    right: 0;
    font-size: 1.5em;
    cursor: pointer;
    background: none;
    border: none;
    outline: none;
}

.dark_mod_active {
    background: #1c1c25;
}

.dark_mod_active button {
    color: #ddd;
}

.dark_mod_active #clear,
.dark_mod_active #equalTo {
    color: #000;
}

.dark_mod_active #result {
    color: #ddd;
}

.dark_mod_active #history {
    color: #ddd;
}

#history {
    position: absolute;
    bottom: 5px;
    right: 0;
}   
    </style>
</head>
<body>

    <div class="main">

        <div class="display">
            <button class="dark_mod_btn">
                <i class="fa fa-moon"></i>
            </button>

            <p id="history">
                <i class="fa fa-history">&nbsp;history</i>
            </p>

            <h2 id="result"></h2>
        </div>

        <div class="buttons">
            <button id="clear">C</button>
            <button id="delet_single_num">
                <i class="fa fa-cut"></i>
            </button>
            <button id="normal_btn">/</button>
            <button id="normal_btn">*</button>
        </div>

        <div class="buttons">
            <button id="normal_btn">7</button>
            <button id="normal_btn">8</button>
            <button id="normal_btn">9</button>
            <button id="normal_btn">-</button>
        </div>

        <div class="buttons">
            <button id="normal_btn">4</button>
            <button id="normal_btn">5</button>
            <button id="normal_btn">6</button>
            <button id="normal_btn">+</button>
        </div>

        <div class="buttons">
            <button id="normal_btn">1</button>
            <button id="normal_btn">2</button>
            <button id="normal_btn">3</button>
            <button id="normal_btn">3</button>
        </div>

        <div class="buttons">
            <button id="normal_btn">0</button>
            <button id="normal_btn">00</button>
            <button id="equalTo">=</button>
        </div>

    </div>

    <script>let body = document.querySelector('body');
let result = document.querySelector('#result');

let dark_mode_btn = document.querySelector('.dark_mod_btn');
let clear = document.querySelector('#clear');
let history = document.querySelector('#history');
let delete_single_num = document.querySelector('#delet_single_num');
let equalTo = document.querySelector('#equalTo');

let Normal_btn = document.querySelectorAll('#normal_btn');

let initial_value = '';

Normal_btn.forEach((Normal_btn) => {
    Normal_btn.addEventListener('click', function() {
        let text = this.innerHTML;
        initial_value += text;
        result.innerHTML = initial_value;
    });
});


// Clear All Number

clear.addEventListener("click", () => {
    result.innerHTML = "";
    initial_value = "";
});


// Delete Single Number

delete_single_num.addEventListener("click", () => {

    result.innerHTML = result.innerHTML.substring(
        0,
        result.innerHTML.length - 1
    );

    initial_value = result.innerHTML;
});


// Equal To Button Action

equalTo.addEventListener("click", () => {

    if (initial_value != "") {

        history.innerHTML = initial_value;

        initial_value = eval(initial_value);

        result.innerHTML = initial_value;

    } else {

        alert("please enter any number");

    }

});


// Dark Mode

let dark_mode_status = false;

dark_mode_btn.addEventListener("click", function () {

    body.classList.toggle("dark_mod_active");

    if (dark_mode_status == false) {

        this.innerHTML = '<i class="fa fa-sun"></i>';

        dark_mode_status = true;

    } else {

        this.innerHTML = '<i class="fa fa-moon"></i>';

        dark_mode_status = false;

    }

});</script>
</body>
</html>
